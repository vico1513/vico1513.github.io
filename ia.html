<body>


<header>

<div class="brand">

    <img
        src="vico-comunity.jpeg"
        alt="Vico"

    <div class="brand-text">

        <span class="brand-title">
            🤖 VicoAI
        </span>

        <span class="brand-subtitle">

        </span>

</div>


<div class="header-right">

    <span id="userNickname">

    </span>

    <button
        id="logoutButton"
        type="button"
    >
        🚪 Sair
    </button>

</div>

</header>


<main id="main">


<div class="welcome">

    <h1>

    </h1>

    <p>

        criar e tirar dúvidas.
    </p>

</div>


<div id="chat">

    <div class="message ai-message">

        <div class="message-label">
            🤖 VicoAI
        </div>

        Olá! 👋

        <br><br>

        Sou a VicoAI Geral.

    </div>

</div>


<div class="input-area">

    <div class="input-wrapper">

        <div
            id="imagePreview"

        >

                id="previewImage"
                alt="Imagem selecionada"
            >

            <button
                id="removeImage"
                class="remove-image"
                type="button"
            >

            </button>

        <textarea

            placeholder="Digite sua pergunta..."
            rows="1"
        ></textarea>

    >

    >

    </button>

    >

    </button>

    VicoAI • Área autorizada
</div>


</main>


<script>


/* =========================================
   SUPABASE
========================================= */

const SUPABASE_URL =
    "https://fqalhymfpiexyrbyxnka.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_PkDk3a1iNC76ez4Uvqc4Kg_6A7DuTgy";


/* =========================================
   ELEMENTOS
========================================= */

const main =
    document.getElementById("main");

const chat =
    document.getElementById("chat");

const prompt =
    document.getElementById("prompt");

const sendButton =
    document.getElementById("sendButton");

const imageButton =
    document.getElementById("imageButton");

const imageInput =
    document.getElementById("imageInput");

const imagePreview =
    document.getElementById("imagePreview");

const previewImage =
    document.getElementById("previewImage");

const removeImage =
    document.getElementById("removeImage");

const userNickname =
    document.getElementById("userNickname");

const logoutButton =
    document.getElementById("logoutButton");


/* =========================================
   SESSÃO
========================================= */

let accessToken =
    localStorage.getItem(
        "vico_access_token"
    );


/* =========================================
   APELIDO
========================================= */

const nickname =
    localStorage.getItem(
        "vico_nickname"
    );

if (nickname) {

    userNickname.textContent =
        "👤 " + nickname;

}


/* =========================================
   DESCONECTAR
========================================= */

function desconectar() {

    localStorage.removeItem(
        "vico_access_token"
    );

    localStorage.removeItem(
        "vico_refresh_token"
    );

    localStorage.removeItem(
        "vico_nickname"
    );

    window.location.href =
        "login.html";

}


logoutButton.addEventListener(
    "click",
    desconectar
);


/* =========================================
   INATIVIDADE
========================================= */

const TEMPO_INATIVIDADE =
    10 * 60 * 1000;

let temporizadorInatividade;


function reiniciarTemporizador() {

    clearTimeout(
        temporizadorInatividade
    );

    temporizadorInatividade =
        setTimeout(
            function() {

                alert(
                    "⏱️ Sua sessão foi encerrada por 10 minutos de inatividade."
                );

                desconectar();

            },
            TEMPO_INATIVIDADE
        );

}


[
    "mousemove",
    "mousedown",
    "keydown",
    "scroll",
    "touchstart",
    "click"
].forEach(
    function(evento) {

        document.addEventListener(
            evento,
            reiniciarTemporizador,
            {
                passive: true
            }
        );

    }
);

reiniciarTemporizador();


/* =========================================
   VERIFICAR ACESSO
========================================= */

async function verificarAcesso() {

    if (!accessToken) {

        window.location.href =
            "login.html";

        return;

    }


    try {

        const userResponse =
            await fetch(
                SUPABASE_URL +
                "/auth/v1/user",
                {

                    method: "GET",

                    headers: {

                        "apikey":
                            SUPABASE_KEY,

                        "Authorization":
                            "Bearer " +
                            accessToken

                    }

                }
            );


        if (!userResponse.ok) {

            desconectar();

            return;

        }


        const user =
            await userResponse.json();


        /*
           Se ainda não houver apelido
           salvo, usa o e-mail apenas
           como fallback.
        */

        if (!nickname) {

            userNickname.textContent =
                "👤 " +
                (
                    user.email ||
                    "Usuário"
                );

        }


        const acessoResponse =
            await fetch(

                SUPABASE_URL +
                "/rest/v1/ia_acessos?user_id=eq." +
                encodeURIComponent(user.id) +
                "&select=autorizado",

                {

                    method: "GET",

                    headers: {

                        "apikey":
                            SUPABASE_KEY,

                        "Authorization":
                            "Bearer " +
                            accessToken,

                        "Accept":
                            "application/json"

                    }

                }

            );


        if (!acessoResponse.ok) {

            const erroTexto =
                await acessoResponse.text();

            console.error(
                "ERRO REAL DO SUPABASE:",
                erroTexto
            );


            main.innerHTML = `

                <div class="blocked">

                    <div class="blocked-icon">
                        ⚠️
                    </div>

                    <h2>
                        Não foi possível verificar o acesso
                    </h2>

                    <p>
                        O servidor recusou a consulta
                        da autorização da sua conta.
                    </p>

                    <div class="error-detail">
                        Erro ${acessoResponse.status}: ${erroTexto}
                    </div>

                </div>

            `;

            return;

        }


        const acessos =
            await acessoResponse.json();


        if (
            !acessos.length ||
            acessos[0].autorizado !== true
        ) {

            main.innerHTML = `

                <div class="blocked">

                    <div class="blocked-icon">
                        🔒
                    </div>

                    <h2>
                        Acesso restrito
                    </h2>

                    <p>
                        Sua conta ainda não possui
                        autorização para usar a
                        VicoAI Geral.
                    </p>

                </div>

            `;

            return;

        }


        console.log(
            "VicoAI: acesso autorizado."
        );

    }

    catch (error) {

        console.error(
            "Erro ao verificar acesso:",
            error
        );


        main.innerHTML = `

            <div class="blocked">

                <div class="blocked-icon">
                    ❌
                </div>

                <h2>
                    Erro de conexão
                </h2>

                <p>
                    Não foi possível verificar
                    sua autorização.
                </p>

            </div>

        `;

    }

}


verificarAcesso();


/* =========================================
   IMAGEM
========================================= */

let imagemSelecionada = null;


imageButton.addEventListener(
    "click",
    function() {

        imageInput.click();

    }
);


imageInput.addEventListener(
    "change",
    function() {

        const arquivo =
            imageInput.files[0];

        if (!arquivo) {

            return;

        }


        if (!arquivo.type.startsWith("image/")) {

            alert(
                "Selecione uma imagem."
            );

            imageInput.value =
                "";

            return;

        }


        imagemSelecionada =
            arquivo;


        const url =
            URL.createObjectURL(
                arquivo
            );


        previewImage.src =
            url;


        imagePreview.classList.add(
            "show"
        );

    }
);


removeImage.addEventListener(
    "click",
    function() {

        imagemSelecionada =
            null;

        imageInput.value =
            "";

        previewImage.src =
            "";

        imagePreview.classList.remove(
            "show"
        );

    }
);


/* =========================================
   ADICIONAR MENSAGEM
========================================= */

function adicionarMensagem(
    texto,
    tipo,
    imagem = null
) {

    const message =
        document.createElement("div");


    message.className =
        "message " +
        (
            tipo === "user"
                ? "user-message"
                : "ai-message"
        );


    const label =
        document.createElement("div");


    label.className =
        "message-label";


    label.textContent =
        tipo === "user"
            ? "Você"
            : "🤖 VicoAI";


    message.appendChild(
        label
    );


    if (imagem) {

        const img =
            document.createElement("img");

        img.src =
            imagem;

        img.style.maxWidth =
            "260px";

        img.style.maxHeight =
            "220px";

        img.style.borderRadius =
            "12px";

        img.style.display =
            "block";

        img.style.marginBottom =
            "10px";

        message.appendChild(
            img
        );

    }


    if (texto) {

        const content =
            document.createElement("div");

        content.textContent =
            texto;

        message.appendChild(
            content
        );

    }


    chat.appendChild(
        message
    );


    chat.scrollTop =
        chat.scrollHeight;

}


/* =========================================
   ENVIAR
========================================= */

sendButton.addEventListener(
    "click",
    enviarMensagem
);


prompt.addEventListener(
    "keydown",
    function(event) {

        if (
            event.key === "Enter" &&
            !event.shiftKey
        ) {

            event.preventDefault();

            enviarMensagem();

        }

    }
);


async function enviarMensagem() {

    const texto =
        prompt.value.trim();


    if (
        !texto &&
        !imagemSelecionada
    ) {

        return;

    }


    let imagemURL = null;


    if (imagemSelecionada) {

        imagemURL =
            URL.createObjectURL(
                imagemSelecionada
            );

    }


    adicionarMensagem(
        texto,
        "user",
        imagemURL
    );


    prompt.value =
        "";


    imagemSelecionada =
        null;

    imageInput.value =
        "";

    imagePreview.classList.remove(
        "show"
    );

    previewImage.src =
        "";


    sendButton.disabled =
        true;


    const loading =
        document.createElement("div");


    loading.className =
        "message ai-message";


    loading.innerHTML = `

        <div class="message-label">
            🤖 VicoAI
        </div>

        <div class="loading">

            <span>
                Analisando
            </span>

            <span class="loading-dot"></span>

        </div>

    `;


    chat.appendChild(
        loading
    );


    chat.scrollTop =
        chat.scrollHeight;


    /*
       A imagem já é selecionada,
       exibida e enviada junto
       da mensagem na interface.

       A conexão com o modelo que
       realmente analisa a imagem
       será adicionada depois.
    */


    setTimeout(
        function() {

            loading.remove();


            adicionarMensagem(
                "Recebi sua mensagem" +
                (
                    imagemURL
                        ? " e a imagem! 🖼️"
                        : "!"
                ) +
                " Agora falta conectar o cérebro da VicoAI.",
                "ai"
            );


            sendButton.disabled =
                false;

        },
        1000
    );

}

</script>

</body>
