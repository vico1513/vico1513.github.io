<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>VicoAI | Geral</title>

    <link
        rel="icon"
        type="image/png"
        href="favicon.png"
    >

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {

            min-height: 100vh;

            font-family:
                Arial,
                Helvetica,
                sans-serif;

            color: white;

            background:
                linear-gradient(
                    rgba(16, 9, 28, 0.75),
                    rgba(16, 9, 28, 0.92)
                ),
                url("FF186E10-B115-4C11-8BCA-DB22C5F2B07A.png");

            background-size: cover;
            background-position: center;
            background-attachment: fixed;

            display: flex;
            flex-direction: column;

        }


        /* =========================
           HEADER
        ========================= */

        header {

            height: 70px;

            display: flex;

            align-items: center;

            justify-content: space-between;

            padding: 0 25px;

            background:
                rgba(20, 10, 34, 0.88);

            backdrop-filter: blur(15px);

            border-bottom:
                1px solid
                rgba(192, 132, 252, 0.25);

        }


        .brand {

            display: flex;

            align-items: center;

            gap: 12px;

            font-weight: bold;

        }


        .brand img {

            width: 43px;
            height: 43px;

            border-radius: 50%;

            object-fit: cover;

            border:
                2px solid
                rgba(216, 180, 254, 0.6);

        }


        .brand span {

            color: #e9b6ff;

            font-size: 20px;

        }


        #userEmail {

            color: #aaa;

            font-size: 13px;

        }


        /* =========================
           CHAT
        ========================= */

        main {

            flex: 1;

            width: 100%;

            max-width: 1000px;

            margin: auto;

            display: flex;

            flex-direction: column;

            padding: 30px 18px 20px;

        }


        .welcome {

            text-align: center;

            margin-bottom: 25px;

        }


        .welcome h1 {

            font-size:
                clamp(
                    30px,
                    6vw,
                    48px
                );

            color: #e9b6ff;

            margin-bottom: 10px;

            text-shadow:
                0 0 25px
                rgba(192, 132, 252, 0.3);

        }


        .welcome p {

            color: #bbb;

            line-height: 1.6;

        }


        #chat {

            flex: 1;

            display: flex;

            flex-direction: column;

            gap: 15px;

            overflow-y: auto;

            padding: 10px 5px 20px;

            min-height: 250px;

        }


        .message {

            max-width: 78%;

            padding: 15px 17px;

            border-radius: 17px;

            line-height: 1.6;

            word-wrap: break-word;

        }


        .ai-message {

            align-self: flex-start;

            background:
                rgba(35, 20, 54, 0.9);

            border:
                1px solid
                rgba(192, 132, 252, 0.2);

        }


        .user-message {

            align-self: flex-end;

            background:
                linear-gradient(
                    135deg,
                    #7c3aed,
                    #9333ea
                );

        }


        .message-label {

            font-size: 12px;

            color: #c9a7df;

            margin-bottom: 5px;

            font-weight: bold;

        }


        .user-message .message-label {

            color: #eee;

        }


        /* =========================
           INPUT
        ========================= */

        .input-area {

            width: 100%;

            display: flex;

            gap: 10px;

            padding-top: 10px;

        }


        #prompt {

            flex: 1;

            min-height: 55px;

            max-height: 150px;

            resize: vertical;

            padding: 16px;

            border-radius: 15px;

            border:
                1px solid
                rgba(139, 92, 246, 0.3);

            background:
                rgba(27, 17, 43, 0.9);

            color: white;

            outline: none;

            font-family: inherit;

            font-size: 15px;

        }


        #prompt:focus {

            border-color: #9b6cff;

            box-shadow:
                0 0 0 3px
                rgba(124, 58, 237, 0.12);

        }


        #sendButton {

            width: 58px;

            min-width: 58px;

            border: none;

            border-radius: 15px;

            background:
                linear-gradient(
                    135deg,
                    #7c3aed,
                    #9333ea
                );

            color: white;

            font-size: 21px;

            cursor: pointer;

            transition: 0.2s;

        }


        #sendButton:hover {

            transform: translateY(-2px);

            filter: brightness(1.12);

        }


        #sendButton:disabled {

            opacity: 0.5;

            cursor: not-allowed;

            transform: none;

        }


        .bottom-info {

            text-align: center;

            color: #777;

            font-size: 12px;

            margin-top: 10px;

        }


        .loading {

            display: inline-flex;

            align-items: center;

            gap: 6px;

            color: #c9a7df;

        }


        .loading-dot {

            width: 7px;
            height: 7px;

            border-radius: 50%;

            background: #c084fc;

            animation:
                loadingPulse
                0.9s infinite;

        }


        @keyframes loadingPulse {

            0% {
                opacity: 1;
            }

            50% {
                opacity: 0.15;
            }

            100% {
                opacity: 1;
            }

        }


        .blocked {

            text-align: center;

            margin: auto;

            max-width: 500px;

            padding: 35px;

            background:
                rgba(27, 17, 43, 0.9);

            border:
                1px solid
                rgba(248, 113, 113, 0.35);

            border-radius: 20px;

        }


        .blocked h2 {

            color: #fca5a5;

            margin-bottom: 12px;

        }


        .blocked p {

            color: #bbb;

            line-height: 1.6;

        }


        @media (max-width: 600px) {

            header {

                padding: 0 15px;

            }

            #userEmail {

                display: none;

            }

            .message {

                max-width: 90%;

            }

        }

    </style>

</head>


<body>


<header>

    <div class="brand">

        <img
            src="FF186E10-B115-4C11-8BCA-DB22C5F2B07A.png"
            alt="Vico"
        >

        <span>
            🤖 VicoAI
        </span>

    </div>


    <span id="userEmail"></span>

</header>


<main id="main">


    <div class="welcome">

        <h1>
            💜 VicoAI Geral
        </h1>

        <p>
            Uma IA para ajudar você a aprender,
            criar e tirar dúvidas.
        </p>

    </div>


    <div id="chat">

        <div class="message ai-message">

            <div class="message-label">
                🤖 VicoAI
            </div>

            Olá! 👋

            <br><br>

            Sou a VicoAI Geral.
            Como posso ajudar você hoje?

        </div>

    </div>


    <div class="input-area">

        <textarea
            id="prompt"
            placeholder="Digite sua pergunta..."
            rows="1"
        ></textarea>


        <button
            id="sendButton"
            type="button"
        >
            ➤
        </button>

    </div>


    <div class="bottom-info">

        VicoAI • Área autorizada

    </div>

</main>


<script>


/* =========================================
   SUPABASE
========================================= */

const SUPABASE_URL =
    "https://fqalhymfpiexyrbyxnka.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_PkDk3a1iNC76ez4Uvqc4Kg_6A7DuTgy";


/* =========================================
   ELEMENTOS
========================================= */

const main =
    document.getElementById("main");

const chat =
    document.getElementById("chat");

const prompt =
    document.getElementById("prompt");

const sendButton =
    document.getElementById("sendButton");

const userEmail =
    document.getElementById("userEmail");


/* =========================================
   TOKEN
========================================= */

const accessToken =
    localStorage.getItem(
        "vico_access_token"
    );


/* =========================================
   VERIFICAR LOGIN
========================================= */

async function verificarAcesso() {

    if (!accessToken) {

        window.location.href =
            "login.html";

        return;

    }


    try {

        const response =
            await fetch(
                SUPABASE_URL +
                "/auth/v1/user",
                {
                    headers: {

                        "apikey":
                            SUPABASE_KEY,

                        "Authorization":
                            "Bearer " +
                            accessToken

                    }

                }
            );


        if (!response.ok) {

            localStorage.removeItem(
                "vico_access_token"
            );

            localStorage.removeItem(
                "vico_refresh_token"
            );

            window.location.href =
                "login.html";

            return;

        }


        const user =
            await response.json();


        userEmail.textContent =
            user.email || "";


        const acessoResponse =
            await fetch(
                SUPABASE_URL +
                "/rest/v1/ia_acessos?user_id=eq." +
                user.id +
                "&select=autorizado",
                {
                    headers: {

                        "apikey":
                            SUPABASE_KEY,

                        "Authorization":
                            "Bearer " +
                            accessToken

                    }

                }
            );


        if (!acessoResponse.ok) {

            throw new Error(
                "Não foi possível verificar o acesso."
            );

        }


        const acessos =
            await acessoResponse.json();


        if (
            !acessos.length ||
            acessos[0].autorizado !== true
        ) {

            main.innerHTML = `

                <div class="blocked">

                    <h2>
                        🔒 Acesso restrito
                    </h2>

                    <p>
                        Sua conta ainda não possui
                        autorização para usar a
                        VicoAI Geral.
                    </p>

                </div>

            `;

            return;

        }

    }

    catch (error) {

        console.error(error);

        main.innerHTML = `

            <div class="blocked">

                <h2>
                    ❌ Erro
                </h2>

                <p>
                    Não foi possível verificar
                    seu acesso.
                </p>

            </div>

        `;

    }

}


verificarAcesso();


/* =========================================
   ADICIONAR MENSAGEM
========================================= */

function adicionarMensagem(
    texto,
    tipo
) {

    const message =
        document.createElement("div");

    message.className =
        "message " +
        (
            tipo === "user"
                ? "user-message"
                : "ai-message"
        );


    const label =
        document.createElement("div");

    label.className =
        "message-label";


    label.textContent =
        tipo === "user"
            ? "Você"
            : "🤖 VicoAI";


    const content =
        document.createElement("div");


    content.textContent =
        texto;


    message.appendChild(label);

    message.appendChild(content);

    chat.appendChild(message);


    chat.scrollTop =
        chat.scrollHeight;

}


/* =========================================
   ENVIAR
========================================= */

sendButton.addEventListener(
    "click",
    enviarMensagem
);


prompt.addEventListener(
    "keydown",
    function(event) {

        if (
            event.key === "Enter" &&
            !event.shiftKey
        ) {

            event.preventDefault();

            enviarMensagem();

        }

    }
);


async function enviarMensagem() {

    const texto =
        prompt.value.trim();


    if (!texto) {
        return;
    }


    adicionarMensagem(
        texto,
        "user"
    );


    prompt.value = "";

    sendButton.disabled =
        true;


    const loading =
        document.createElement("div");

    loading.className =
        "message ai-message";


    loading.innerHTML = `

        <div class="message-label">
            🤖 VicoAI
        </div>

        <div class="loading">

            <span>
                Pensando
            </span>

            <span class="loading-dot"></span>

        </div>

    `;


    chat.appendChild(loading);

    chat.scrollTop =
        chat.scrollHeight;


    /*
       AQUI VAI ENTRAR
       O BACKEND DA IA.
    */

    setTimeout(
        function() {

            loading.remove();

            adicionarMensagem(
                "A conexão com o cérebro da VicoAI ainda será configurada. 🧠",
                "ai"
            );

            sendButton.disabled =
                false;

        },
        1000
    );

}

</script>

</body>

</html>
