<!DOCTYPE html>

<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>VicoAI | Geral</title>

    type="image/jpeg"
    href="vico-comunity.jpeg"

<style>

    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
    }

    html,
    body {
        min-height: 100%;
    }

    body {

        min-height: 100vh;

        font-family:
            Arial,
            Helvetica,
            sans-serif;

        color: white;

        background:
            linear-gradient(
                rgba(16, 9, 28, 0.74),
                rgba(16, 9, 28, 0.94)
            ),
            url("FF186E10-B115-4C11-8BCA-DB22C5F2B07A.png");

        background-size: cover;
        background-position: center;
        background-attachment: fixed;

        display: flex;
        flex-direction: column;

    }


    /* =========================
       HEADER
    ========================= */

    header {

        height: 72px;

        display: flex;

        align-items: center;

        justify-content: space-between;

        padding:
            0 24px;

        background:
            rgba(20, 10, 34, 0.90);

        backdrop-filter:
            blur(16px);

        -webkit-backdrop-filter:
            blur(16px);

        border-bottom:
            1px solid
            rgba(192, 132, 252, 0.25);

        box-shadow:
            0 8px 30px
            rgba(0, 0, 0, 0.20);

    }


    .brand {

        display: flex;

        align-items: center;

        gap: 12px;

    }


    .brand img {

        width: 46px;
        height: 46px;

        border-radius: 50%;

        object-fit: cover;

        border:
            2px solid
            rgba(216, 180, 254, 0.65);

        box-shadow:
            0 0 18px
            rgba(192, 132, 252, 0.25);

    }


    .brand-text {

        display: flex;

        flex-direction: column;

        gap: 2px;

    }


    .brand-title {

        font-size: 19px;

        font-weight: bold;

        color: #e9b6ff;

    }


    .brand-subtitle {

        font-size: 11px;

        color: #888;

    }


    #userEmail {

        color: #aaa;

        font-size: 13px;

        max-width: 280px;

        overflow: hidden;

        text-overflow: ellipsis;

        white-space: nowrap;

    }


    /* =========================
       MAIN
    ========================= */

    main {

        width: 100%;

        max-width: 1000px;

        margin: auto;

        padding:
            35px 18px 25px;

        display: flex;

        flex-direction: column;

        flex: 1;

    }


    .welcome {

        text-align: center;

        margin-bottom: 22px;

    }


    .welcome h1 {

        font-size:
            clamp(
                30px,
                6vw,
                46px
            );

        color: #e9b6ff;

        margin-bottom: 8px;

        text-shadow:
            0 0 25px
            rgba(192, 132, 252, 0.30);

    }


    .welcome p {

        color: #aaa;

        line-height: 1.6;

    }


    /* =========================
       CHAT
    ========================= */

    #chat {

        display: flex;

        flex-direction: column;

        gap: 14px;

        min-height: 300px;

        max-height: 58vh;

        overflow-y: auto;

        padding:
            8px 5px 20px;

        scrollbar-width: thin;

    }


    .message {

        max-width: 78%;

        padding:
            14px 17px;

        border-radius: 17px;

        line-height: 1.6;

        word-break: break-word;

    }


    .ai-message {

        align-self: flex-start;

        background:
            rgba(35, 20, 54, 0.92);

        border:
            1px solid
            rgba(192, 132, 252, 0.22);

        box-shadow:
            0 8px 25px
            rgba(0, 0, 0, 0.12);

    }


    .user-message {

        align-self: flex-end;

        background:
            linear-gradient(
                135deg,
                #7c3aed,
                #9333ea
            );

        box-shadow:
            0 8px 25px
            rgba(124, 58, 237, 0.20);

    }


    .message-label {

        font-size: 11px;

        font-weight: bold;

        color: #c9a7df;

        margin-bottom: 5px;

    }


    .user-message .message-label {

        color: #eee;

    }


    /* =========================
       INPUT
    ========================= */

    .input-area {

        display: flex;

        align-items: flex-end;

        gap: 10px;

        margin-top: 10px;

    }


    #prompt {

        flex: 1;

        min-height: 55px;

        max-height: 150px;

        resize: vertical;

        padding:
            15px 16px;

        border:
            1px solid
            rgba(139, 92, 246, 0.30);

        border-radius: 15px;

        background:
            rgba(27, 17, 43, 0.92);

        color: white;

        outline: none;

        font-family: inherit;

        font-size: 15px;

    }


    #prompt:focus {

        border-color:
            #9b6cff;

        box-shadow:
            0 0 0 3px
            rgba(124, 58, 237, 0.12);

    }


    #prompt::placeholder {

        color: #888;

    }


    #sendButton {

        width: 58px;

        height: 55px;

        min-width: 58px;

        border: none;

        border-radius: 15px;

        background:
            linear-gradient(
                135deg,
                #7c3aed,
                #9333ea
            );

        color: white;

        font-size: 20px;

        cursor: pointer;

        transition:
            0.2s ease;

    }


    #sendButton:hover {

        transform:
            translateY(-2px);

        filter:
            brightness(1.12);

    }


    #sendButton:disabled {

        opacity: 0.55;

        cursor:
            not-allowed;

        transform:
            none;

    }


    .bottom-info {

        text-align: center;

        color: #666;

        font-size: 11px;

        margin-top: 9px;

    }


    /* =========================
       LOADING
    ========================= */

    .loading {

        display: flex;

        align-items: center;

        gap: 7px;

        color: #c9a7df;

    }


    .loading-dot {

        width: 7px;
        height: 7px;

        border-radius: 50%;

        background:
            #c084fc;

        animation:
            loadingPulse
            0.9s infinite;

    }


    @keyframes loadingPulse {

        0% {
            opacity: 1;
        }

        50% {
            opacity: 0.15;
        }

        100% {
            opacity: 1;
        }

    }


    /* =========================
       BLOQUEADO / ERRO
    ========================= */

    .blocked {

        width: 100%;

        max-width: 550px;

        margin: auto;

        padding:
            38px 28px;

        text-align: center;

        background:
            rgba(27, 17, 43, 0.92);

        border:
            1px solid
            rgba(248, 113, 113, 0.35);

        border-radius: 22px;

        box-shadow:
            0 20px 60px
            rgba(0, 0, 0, 0.30);

    }


    .blocked-icon {

        font-size: 50px;

        margin-bottom: 15px;

    }


    .blocked h2 {

        color: #fca5a5;

        margin-bottom: 12px;

    }


    .blocked p {

        color: #bbb;

        line-height: 1.6;

    }


    .error-detail {

        margin-top: 18px;

        padding: 12px;

        border-radius: 10px;

        background:
            rgba(0, 0, 0, 0.25);

        color: #888;

        font-size: 11px;

        word-break: break-word;

        text-align: left;

    }


    @media (max-width: 600px) {

        header {

            padding:
                0 14px;

        }

        .brand-subtitle {

            display: none;

        }

        #userEmail {

            display: none;

        }

        main {

            padding:
                25px 12px 18px;

        }

        .message {

            max-width: 90%;

        }

        #chat {

            max-height: 55vh;

        }

    }

</style>
```

</head>

<body>

<header>

```
<div class="brand">

    <img

    >

    <div class="brand-text">

        <span class="brand-title">

        </span>

        <span class="brand-subtitle">

        </span>

</div>


<span id="userEmail"></span>

</header>

<main id="main">

```
<div class="welcome">

    <h1>
        💜 VicoAI Geral
    </h1>

    <p>
        Uma IA para ajudar você a aprender,
        criar e tirar dúvidas.
    </p>

</div>


<div id="chat">

    <div class="message ai-message">

        <div class="message-label">
            🤖 VicoAI
        </div>

        <br><br>

        Sou a VicoAI Geral.
        Como posso ajudar você hoje?

</div>

    <textarea
        id="prompt"

        ➤

```

</main>

<script>


/* =========================================
   SUPABASE
========================================= */

const SUPABASE_URL =
    "https://fqalhymfpiexyrbyxnka.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_PkDk3a1iNC76ez4Uvqc4Kg_6A7DuTgy";


/* =========================================
   ELEMENTOS
========================================= */

const main =
    document.getElementById("main");

const chat =
    document.getElementById("chat");

const prompt =
    document.getElementById("prompt");

const sendButton =
    document.getElementById("sendButton");

const userEmail =
    document.getElementById("userEmail");


/* =========================================
   SESSÃO
========================================= */

const accessToken =
    localStorage.getItem(
        "vico_access_token"
    );


/* =========================================
   VERIFICAR ACESSO
========================================= */

async function verificarAcesso() {

    if (!accessToken) {

        window.location.href =
            "login.html";

        return;

    }


    try {

        const userResponse =
            await fetch(
                SUPABASE_URL +
                "/auth/v1/user",
                {
                    method: "GET",

                    headers: {

                        "apikey":
                            SUPABASE_KEY,

                        "Authorization":
                            "Bearer " +
                            accessToken

                    }

                }
            );


        if (!userResponse.ok) {

            localStorage.removeItem(
                "vico_access_token"
            );

            localStorage.removeItem(
                "vico_refresh_token"
            );

            window.location.href =
                "login.html";

            return;

        }


        const user =
            await userResponse.json();


        userEmail.textContent =
            user.email || "";


        /* =========================
           CONSULTAR IA_ACESSOS
        ========================= */

        const acessoResponse =
            await fetch(

                SUPABASE_URL +
                "/rest/v1/ia_acessos?user_id=eq." +
                encodeURIComponent(user.id) +
                "&select=autorizado",

                {

                    method: "GET",

                    headers: {

                        "apikey":
                            SUPABASE_KEY,

                        "Authorization":
                            "Bearer " +
                            accessToken,

                        "Accept":
                            "application/json"

                    }

                }

            );


        if (!acessoResponse.ok) {

            const erroTexto =
                await acessoResponse.text();

            console.error(
                "ERRO REAL DO SUPABASE:",
                erroTexto
            );

            main.innerHTML = `

                <div class="blocked">

                    <div class="blocked-icon">
                        ⚠️
                    </div>

                    <h2>
                        Não foi possível verificar o acesso
                    </h2>

                    <p>
                        O servidor recusou a consulta
                        da autorização da sua conta.
                    </p>

                    <div class="error-detail">
                        Erro ${acessoResponse.status}: ${erroTexto}
                    </div>

                </div>

            `;

            return;

        }


        const acessos =
            await acessoResponse.json();


        if (
            !acessos.length ||
            acessos[0].autorizado !== true
        ) {

            main.innerHTML = `

                <div class="blocked">

                    <div class="blocked-icon">
                        🔒
                    </div>

                    <h2>
                        Acesso restrito
                    </h2>

                    <p>
                        Sua conta ainda não possui
                        autorização para usar a
                        VicoAI Geral.
                    </p>

                </div>

            `;

            return;

        }


        console.log(
            "VicoAI: acesso autorizado."
        );

    }

    catch (error) {

        console.error(
            "Erro ao verificar acesso:",
            error
        );

        main.innerHTML = `

            <div class="blocked">

                <div class="blocked-icon">
                    ❌
                </div>

                <h2>
                    Erro de conexão
                </h2>

                <p>
                    Não foi possível verificar
                    sua autorização.
                </p>

            </div>

        `;

    }

}


verificarAcesso();


/* =========================================
   ADICIONAR MENSAGEM
========================================= */

function adicionarMensagem(
    texto,
    tipo
) {

    const message =
        document.createElement("div");

    message.className =
        "message " +
        (
            tipo === "user"
                ? "user-message"
                : "ai-message"
        );


    const label =
        document.createElement("div");

    label.className =
        "message-label";


    label.textContent =
        tipo === "user"
            ? "Você"
            : "🤖 VicoAI";


    const content =
        document.createElement("div");


    content.textContent =
        texto;


    message.appendChild(label);

    message.appendChild(content);

    chat.appendChild(message);


    chat.scrollTop =
        chat.scrollHeight;

}


/* =========================================
   ENVIAR
========================================= */

sendButton.addEventListener(
    "click",
    enviarMensagem
);


prompt.addEventListener(
    "keydown",
    function(event) {

        if (
            event.key === "Enter" &&
            !event.shiftKey
        ) {

            event.preventDefault();

            enviarMensagem();

        }

    }
);


async function enviarMensagem() {

    const texto =
        prompt.value.trim();


    if (!texto) {
        return;
    }


    adicionarMensagem(
        texto,
        "user"
    );


    prompt.value =
        "";


    sendButton.disabled =
        true;


    const loading =
        document.createElement("div");

    loading.className =
        "message ai-message";


    loading.innerHTML = `

        <div class="message-label">
            🤖 VicoAI
        </div>

        <div class="loading">

            <span>
                Pensando
            </span>

            <span class="loading-dot"></span>

        </div>

    `;


    chat.appendChild(loading);


    chat.scrollTop =
        chat.scrollHeight;


    /*
       A CONEXÃO COM O MODELO
       SERÁ ADICIONADA NA PRÓXIMA ETAPA.
    */

    setTimeout(
        function() {

            loading.remove();

            adicionarMensagem(
                "A interface está funcionando! 🧠 Agora vamos conectar o cérebro da VicoAI.",
                "ai"
            );

            sendButton.disabled =
                false;

        },
        1000
    );

}

</script>

</body>
