            box-shadow:

            font-size: 22px;

        .brand-text p {

            display: flex;
            gap: 8px;
            flex-wrap: wrap;

        }

        nav a {
            color: #ddd;
            text-decoration: none;
            padding: 9px 12px;
            border-radius: 9px;
            transition: 0.2s;
            font-size: 14px;
        }

        nav a:hover {
            color: white;
            background: rgba(124, 58, 237, 0.25);
        }

            overflow: hidden;
            min-height: 570px;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 90px 20px;
            background:
                linear-gradient(
                    135deg,
                    rgba(27, 13, 46, 0.95),
                    rgba(50, 16, 92, 0.88)
                );
        }

        .hero::before {
            content: "";
            position: absolute;
            width: 500px;
            height: 500px;
            background:
                radial-gradient(
                    circle,
                    rgba(168, 85, 247, 0.28),
                    transparent 65%
                );
            top: -200px;
            left: -150px;
            animation: float 7s ease-in-out infinite;
        }

        .hero::after {
            content: "";
            position: absolute;
            width: 500px;
            height: 500px;
            background:
                radial-gradient(
                    circle,
                    rgba(216, 180, 254, 0.12),
                    transparent 65%
                );
            bottom: -250px;
            right: -150px;
            animation: float 9s ease-in-out infinite reverse;
        }

        @keyframes float {
            0%, 100% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(25px);
            }
        }

        .hero-content {
            position: relative;
            z-index: 2;
            max-width: 800px;
        }

            border-radius: 50%;
            object-fit: cover;
            border: 4px solid #c084fc;

            margin-bottom: 25px;
        }
