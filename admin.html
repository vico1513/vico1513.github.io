<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Admin | Vico1513</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #10091c;
            color: white;
            min-height: 100vh;
        }

        header {
            padding: 25px;
            text-align: center;
            background: #1b0d2e;
            border-bottom: 2px solid #8b5cf6;
        }

        header h1 {
            color: #c084fc;
            font-size: 32px;
        }

        header p {
            color: #d8b4fe;
            margin-top: 8px;
        }

        /* =========================
           LOGIN
        ========================= */

        .login-container {
            max-width: 430px;
            margin: 80px auto;
            padding: 20px;
        }

        .login-box {
            background: #1b112b;
            border: 1px solid #3b2160;
            border-radius: 18px;
            padding: 30px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }

        .login-box h2 {
            color: #c084fc;
            margin-bottom: 10px;
        }

        .login-box p {
            color: #aaa;
            margin-bottom: 25px;
        }

        input {
            width: 100%;
            padding: 14px;
            margin-bottom: 12px;
            border: none;
            border-radius: 10px;
            background: #28183d;
            color: white;
            outline: none;
        }

        input:focus {
            outline: 2px solid #7c3aed;
        }

        input::placeholder {
            color: #999;
        }

        button {
            border: none;
            border-radius: 10px;
            padding: 12px 18px;
            color: white;
            font-weight: bold;
            cursor: pointer;
            margin: 5px;
            transition: 0.2s;
        }

        .login-button {
            width: 100%;
            background: #7c3aed;
            margin: 5px 0 0;
        }

        .login-button:hover {
            background: #9333ea;
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .error-message {
            display: none;
            margin-top: 15px;
            padding: 12px;
            border-radius: 10px;
            background: #3d1818;
            border: 1px solid #e74c3c;
            color: #ffaaa2;
        }

        .error-message.show {
            display: block;
        }

        /* =========================
           PAINEL
        ========================= */

        #dashboard {
            display: none;
        }

        .dashboard {
            max-width: 1200px;
            margin: auto;
            padding: 40px 20px;
        }

        .dashboard-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 20px;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }

        .dashboard-header h2 {
            color: #c084fc;
            margin-bottom: 5px;
        }

        .dashboard-header p {
            color: #999;
        }

        .logout-button {
            background: #4c1d3d;
        }

        .logout-button:hover {
            background: #6b244f;
        }

        /* =========================
           COLUNAS
        ========================= */

        .columns {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
        }

        .column {
            background: #150c24;
            border: 1px solid #3b2160;
            border-radius: 16px;
            padding: 20px;
            min-height: 300px;
        }

        .column-title {
            margin-bottom: 20px;
            font-size: 21px;
        }

        .analysis-title {
            color: #facc15;
        }

        .approved-title {
            color: #4ade80;
        }

        .rejected-title {
            color: #f87171;
        }

        /* =========================
           PROPOSTAS
        ========================= */

        .proposal {
            background: #1b112b;
            border: 1px solid #3b2160;
            border-radius: 13px;
            padding: 17px;
            margin-bottom: 15px;
        }

        .proposal h3 {
            color: #d8b4fe;
            margin-bottom: 12px;
            font-size: 18px;
        }

        .proposal p {
            color: #ddd;
            margin-bottom: 8px;
            line-height: 1.5;
            word-break: break-word;
        }

        .proposal strong {
            color: #c084fc;
        }

        .proposal-date {
            color: #888 !important;
            font-size: 13px;
            margin-top: 12px;
        }

        .approve-button {
            background: #15803d;
        }

        .approve-button:hover {
            background: #16a34a;
        }

        .reject-button {
            background: #b91c1c;
        }

        .reject-button:hover {
            background: #dc2626;
        }

        .empty {
            text-align: center;
            color: #777;
            padding: 30px 10px;
        }

        .loading {
            text-align: center;
            color: #aaa;
            padding: 30px;
        }

        /* =========================
           MOBILE
        ========================= */

        @media (max-width: 850px) {

            .columns {
                grid-template-columns: 1fr;
            }

            .dashboard-header {
                align-items: flex-start;
            }

        }

    </style>
</head>


<body>


<header>

    <h1>🌸 Vico1513</h1>

    <p>Central Administrativa</p>

</header>


<!-- =====================================
     LOGIN
===================================== -->

<div
    id="loginContainer"
    class="login-container"
>

    <div class="login-box">

        <h2>🔐 Área Administrativa</h2>

        <p>
            Entre com sua conta de administrador.
        </p>

        <input
            type="email"
            id="email"
            placeholder="E-mail"
            autocomplete="email"
        >

        <input
            type="password"
            id="password"
            placeholder="Senha"
            autocomplete="current-password"
        >

        <button
            id="loginButton"
            class="login-button"
        >
            🔑 Entrar
        </button>

        <div
            id="loginError"
            class="error-message"
        ></div>

    </div>

</div>


<!-- =====================================
     PAINEL
===================================== -->

<div
    id="dashboard"
>

    <div class="dashboard">


        <div class="dashboard-header">

            <div>

                <h2>
                    ⚙️ Painel Administrativo
                </h2>

                <p>
                    Gerencie as propostas recebidas.
                </p>

            </div>

            <button
                id="logoutButton"
                class="logout-button"
            >
                🚪 Sair
            </button>

        </div>


        <div class="columns">


            <!-- EM ANÁLISE -->

            <div class="column">

                <h3
                    class="column-title analysis-title"
                >
                    🟡 Em análise
                </h3>

                <div
                    id="analysisList"
                >
                    <div class="loading">
                        Carregando...
                    </div>
                </div>

            </div>


            <!-- APROVADAS -->

            <div class="column">

                <h3
                    class="column-title approved-title"
                >
                    🟢 Aprovadas
                </h3>

                <div
                    id="approvedList"
                >
                    <div class="loading">
                        Carregando...
                    </div>
                </div>

            </div>


            <!-- RECUSADAS -->

            <div class="column">

                <h3
                    class="column-title rejected-title"
                >
                    🔴 Recusadas
                </h3>

                <div
                    id="rejectedList"
                >
                    <div class="loading">
                        Carregando...
                    </div>
                </div>

            </div>


        </div>

    </div>

</div>


<!-- =====================================
     SUPABASE
===================================== -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


<script>

    // =====================================
    // CONFIGURAÇÃO
    // =====================================

    const SUPABASE_URL =
        "https://fqalhymfpiexyrbyxnka.supabase.co";

    const SUPABASE_KEY =
        "sb_publishable_PkDk3a1iNC76ez4Uvqc4Kg_6A7DuTgy";

    const ADMIN_UID =
        "15ef4f3f-a64f-46ae-82e7-6ad1994a4633";


    const supabaseClient =
        window.supabase.createClient(
            SUPABASE_URL,
            SUPABASE_KEY
        );


    // =====================================
    // ELEMENTOS
    // =====================================

    const loginContainer =
        document.getElementById(
            "loginContainer"
        );

    const dashboard =
        document.getElementById(
            "dashboard"
        );

    const emailInput =
        document.getElementById(
            "email"
        );

    const passwordInput =
        document.getElementById(
            "password"
        );

    const loginButton =
        document.getElementById(
            "loginButton"
        );

    const loginError =
        document.getElementById(
            "loginError"
        );

    const logoutButton =
        document.getElementById(
            "logoutButton"
        );


    // =====================================
    // MOSTRAR ERRO
    // =====================================

    function mostrarErro(mensagem) {

        loginError.textContent =
            mensagem;

        loginError.classList.add(
            "show"
        );

    }


    function esconderErro() {

        loginError.textContent =
            "";

        loginError.classList.remove(
            "show"
        );

    }


    // =====================================
    // LOGIN
    // =====================================

    async function fazerLogin() {

        esconderErro();

        const email =
            emailInput.value.trim();

        const password =
            passwordInput.value;


        if (!email || !password) {

            mostrarErro(
                "Digite seu e-mail e sua senha."
            );

            return;

        }


        loginButton.disabled =
            true;

        loginButton.textContent =
            "⏳ Entrando...";


        try {

            const resultado =
                await supabaseClient.auth
                    .signInWithPassword({

                        email: email,

                        password: password

                    });


            const data =
                resultado.data;

            const error =
                resultado.error;


            if (error) {
                throw error;
            }


            if (!data || !data.user) {

                throw new Error(
                    "Não foi possível identificar o usuário."
                );

            }


            // =================================
            // VERIFICA SE É O ADMIN
            // =================================

            if (
                data.user.id !== ADMIN_UID
            ) {

                await supabaseClient.auth.signOut();

                throw new Error(
                    "Esta conta não possui permissão de administrador."
                );

            }


            mostrarDashboard();


        }

        catch (error) {

            console.error(
                "Erro no login:",
                error
            );

            mostrarErro(
                "❌ " + (
                    error.message ||
                    "Não foi possível entrar."
                )
            );

        }

        finally {

            loginButton.disabled =
                false;

            loginButton.textContent =
                "🔑 Entrar";

        }

    }


    // =====================================
    // MOSTRAR DASHBOARD
    // =====================================

    function mostrarDashboard() {

        loginContainer.style.display =
            "none";

        dashboard.style.display =
            "block";

        carregarPropostas();

    }


    // =====================================
    // VERIFICAR SESSÃO
    // =====================================

    async function verificarSessao() {

        try {

            const resultado =
                await supabaseClient.auth
                    .getSession();


            const session =
                resultado.data.session;


            if (!session) {
                return;
            }


            if (
                session.user.id !== ADMIN_UID
            ) {

                await supabaseClient.auth.signOut();

                return;

            }


            mostrarDashboard();

        }

        catch (error) {

            console.error(
                "Erro ao verificar sessão:",
                error
            );

        }

    }


    // =====================================
    // CARREGAR PROPOSTAS
    // =====================================

    async function carregarPropostas() {

        console.log(
            "🔎 Buscando propostas..."
        );


        const analysisList =
            document.getElementById(
                "analysisList"
            );

        const approvedList =
            document.getElementById(
                "approvedList"
            );

        const rejectedList =
            document.getElementById(
                "rejectedList"
            );


        analysisList.innerHTML =
            '<div class="loading">Carregando...</div>';

        approvedList.innerHTML =
            '<div class="loading">Carregando...</div>';

        rejectedList.innerHTML =
            '<div class="loading">Carregando...</div>';


        try {

            const resultado =
                await supabaseClient
                    .from("parcerias")
                    .select("*")
                    .order("id", {
                        ascending: false
                    });


            const data =
                resultado.data;

            const error =
                resultado.error;


            console.log(
                "📦 Dados recebidos:",
                data
            );

            console.log(
                "❌ Erro:",
                error
            );


            if (error) {

                throw error;

            }


            analysisList.innerHTML = "";

            approvedList.innerHTML = "";

            rejectedList.innerHTML = "";


            let analysisCount = 0;

            let approvedCount = 0;

            let rejectedCount = 0;


            data.forEach(
                function(proposta) {

                    const card =
                        criarCard(
                            proposta
                        );


                    if (
                        proposta.status ===
                        "analise"
                    ) {

                        analysisList.appendChild(
                            card
                        );

                        analysisCount++;

                    }

                    else if (
                        proposta.status ===
                        "aprovada"
                    ) {

                        approvedList.appendChild(
                            card
                        );

                        approvedCount++;

                    }

                    else if (
                        proposta.status ===
                        "recusada"
                    ) {

                        rejectedList.appendChild(
                            card
                        );

                        rejectedCount++;

                    }

                }
            );


            if (
                analysisCount === 0
            ) {

                analysisList.innerHTML =
                    '<div class="empty">Nenhuma proposta em análise.</div>';

            }


            if (
                approvedCount === 0
            ) {

                approvedList.innerHTML =
                    '<div class="empty">Nenhuma proposta aprovada.</div>';

            }


            if (
                rejectedCount === 0
            ) {

                rejectedList.innerHTML =
                    '<div class="empty">Nenhuma proposta recusada.</div>';

            }

        }

        catch (error) {

            console.error(
                "Erro ao carregar propostas:",
                error
            );


            analysisList.innerHTML =
                '<div class="empty">❌ Erro ao carregar.</div>';

            approvedList.innerHTML =
                '<div class="empty">❌ Erro ao carregar.</div>';

            rejectedList.innerHTML =
                '<div class="empty">❌ Erro ao carregar.</div>';


            alert(
                "Erro ao carregar propostas:\n\n" +
                JSON.stringify(
                    error,
                    null,
                    2
                )
            );

        }

    }


    // =====================================
    // CRIAR CARD
    // =====================================

    function criarCard(proposta) {

        const card =
            document.createElement(
                "div"
            );

        card.className =
            "proposal";


        const titulo =
            document.createElement(
                "h3"
            );

        titulo.textContent =
            proposta.nome ||
            "Sem nome";


        const contato =
            document.createElement(
                "p"
            );

        contato.innerHTML =
            "<strong>📱 Contato:</strong> ";

        contato.appendChild(
            document.createTextNode(
                proposta.contato ||
                "Não informado"
            )
        );


        const tipo =
            document.createElement(
                "p"
            );

        tipo.innerHTML =
            "<strong>🏷️ Tipo:</strong> ";

        tipo.appendChild(
            document.createTextNode(
                proposta.tipo ||
                "Não informado"
            )
        );


        const mensagem =
            document.createElement(
                "p"
            );

        mensagem.innerHTML =
            "<strong>💡 Proposta:</strong><br>";

        mensagem.appendChild(
            document.createTextNode(
                proposta.mensagem ||
                ""
            )
        );


        card.appendChild(
            titulo
        );

        card.appendChild(
            contato
        );

        card.appendChild(
            tipo
        );

        card.appendChild(
            mensagem
        );


        // =================================
        // BOTÕES
        // =================================

        if (
            proposta.status ===
            "analise"
        ) {

            const approveButton =
                document.createElement(
                    "button"
                );

            approveButton.className =
                "approve-button";

            approveButton.textContent =
                "✅ Aprovar";


            approveButton.onclick =
                function() {

                    alterarStatus(
                        proposta.id,
                        "aprovada"
                    );

                };


            const rejectButton =
                document.createElement(
                    "button"
                );

            rejectButton.className =
                "reject-button";

            rejectButton.textContent =
                "❌ Recusar";


            rejectButton.onclick =
                function() {

                    alterarStatus(
                        proposta.id,
                        "recusada"
                    );

                };


            card.appendChild(
                approveButton
            );

            card.appendChild(
                rejectButton
            );

        }


        return card;

    }


    // =====================================
    // ALTERAR STATUS
    // =====================================

    async function alterarStatus(
        id,
        novoStatus
    ) {

        const acao =
            novoStatus === "aprovada"
                ? "aprovar"
                : "recusar";


        const confirmar =
            confirm(
                "Tem certeza que deseja " +
                acao +
                " esta proposta?"
            );


        if (!confirmar) {
            return;
        }


        try {

            const resultado =
                await supabaseClient
                    .from("parcerias")
                    .update({
                        status: novoStatus
                    })
                    .eq("id", id);


            const error =
                resultado.error;


            if (error) {

                console.error(
                    "Erro ao atualizar:",
                    error
                );

                alert(
                    "❌ Erro ao atualizar:\n\n" +
                    JSON.stringify(
                        error,
                        null,
                        2
                    )
                );

                return;

            }


            await carregarPropostas();

        }

        catch (error) {

            console.error(
                "Erro:",
                error
            );

            alert(
                "❌ Não foi possível atualizar a proposta."
            );

        }

    }


    // =====================================
    // LOGOUT
    // =====================================

    async function fazerLogout() {

        await supabaseClient.auth.signOut();

        dashboard.style.display =
            "none";

        loginContainer.style.display =
            "block";

        emailInput.value =
            "";

        passwordInput.value =
            "";

        esconderErro();

    }


    // =====================================
    // EVENTOS
    // =====================================

    loginButton.addEventListener(
        "click",
        fazerLogin
    );


    passwordInput.addEventListener(
        "keydown",
        function(event) {

            if (
                event.key === "Enter"
            ) {

                fazerLogin();

            }

        }
    );


    logoutButton.addEventListener(
        "click",
        fazerLogout
    );


    // =====================================
    // INICIAR
    // =====================================

    verificarSessao();

</script>

</body>

</html>
